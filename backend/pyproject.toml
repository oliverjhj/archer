[project]
name = "archer"
version = "0.1.0"
description = "Archer: conversational questions over a sales database, answered with SQL on IBM watsonx"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "langchain_ibm>=1.1,<2",
    "langchain_core>=1.6,<2",
    "ibm_watsonx_ai>=1.7,<2",
    "slowapi",
    "python-multipart",
    "itsdangerous",
    "pyjwt[crypto]",
    "python-dotenv",

]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-mock>=3.14",
]
# The evaluation suite is not part of the test run: it makes real model calls
# and needs live credentials. Installed separately, on purpose.
evals = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["archer*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
strict_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast, isolated unit tests with no external dependencies",
]