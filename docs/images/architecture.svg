<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" width="940" height="460" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Archer request flow</title>
  <desc id="desc">A question arrives at FastAPI, is claimed against a daily budget, planned in the context of the last three exchanges as a data question, data-related conversation or an off-topic request, restated so it stands on its own, then either converted to SQL and run against a read-only SQLite database, answered conversationally, or declined with a fixed message. Every path calls IBM watsonx.ai.</desc>

  <!--
    Colours are chosen to read on both light and dark GitHub themes, so the
    diagram is legible either way without shipping two files. Nothing relies
    on a background colour: every shape has its own fill.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d8d8d"/>
    </marker>
    <style>
      .box   { fill: #2a2a2a; stroke: #6f6f6f; stroke-width: 1.5; rx: 6; }
      .box-accent { fill: #16305c; stroke: #4589ff; stroke-width: 1.5; rx: 6; }
      .box-data   { fill: #1f3d2b; stroke: #42be65; stroke-width: 1.5; rx: 6; }
      .label { fill: #f4f4f4; font-size: 14px; font-weight: 600; }
      .sub   { fill: #a8a8a8; font-size: 11.5px; }
      .edge  { stroke: #8d8d8d; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .edge-label { fill: #a8a8a8; font-size: 11px; font-style: italic; }
      .note  { fill: #8d8d8d; font-size: 11px; }
    </style>
  </defs>

  <!-- Browser -->
  <rect class="box" x="20" y="188" width="118" height="58"/>
  <text class="label" x="79" y="212" text-anchor="middle">Browser</text>
  <text class="sub" x="79" y="230" text-anchor="middle">React + Carbon</text>
  <text class="sub" x="79" y="262" text-anchor="middle">holds the conversation</text>

  <!-- FastAPI -->
  <rect class="box-accent" x="182" y="160" width="168" height="114"/>
  <text class="label" x="266" y="186" text-anchor="middle">FastAPI</text>
  <text class="sub" x="266" y="206" text-anchor="middle">/api/ask  session cookie</text>
  <text class="sub" x="266" y="223" text-anchor="middle">/ask      x-api-key</text>
  <text class="sub" x="266" y="248" text-anchor="middle">daily budget claimed</text>
  <text class="sub" x="266" y="263" text-anchor="middle">before any model call</text>

  <!-- Planner -->
  <rect class="box" x="398" y="174" width="140" height="86"/>
  <text class="label" x="468" y="199" text-anchor="middle">Planner</text>
  <text class="sub" x="468" y="218" text-anchor="middle">data, chat, off-topic?</text>
  <text class="sub" x="468" y="234" text-anchor="middle">resolves follow-ups</text>
  <text class="sub" x="468" y="250" text-anchor="middle">JSON plan</text>

  <!-- SQL generator -->
  <rect class="box" x="588" y="92" width="150" height="72"/>
  <text class="label" x="663" y="117" text-anchor="middle">SQL generator</text>
  <text class="sub" x="663" y="136" text-anchor="middle">live schema injected</text>
  <text class="sub" x="663" y="152" text-anchor="middle">SELECT-only enforced</text>

  <!-- Chat -->
  <rect class="box" x="588" y="284" width="150" height="60"/>
  <text class="label" x="663" y="309" text-anchor="middle">Conversational</text>
  <text class="sub" x="663" y="328" text-anchor="middle">explains answers and terms</text>

  <!-- SQLite -->
  <rect class="box-data" x="792" y="92" width="128" height="72"/>
  <text class="label" x="856" y="117" text-anchor="middle">SQLite</text>
  <text class="sub" x="856" y="136" text-anchor="middle">read-only, 100k rows</text>
  <text class="sub" x="856" y="152" text-anchor="middle">built into the image</text>

  <!-- watsonx -->
  <rect class="box-accent" x="518" y="392" width="290" height="52"/>
  <text class="label" x="663" y="416" text-anchor="middle">IBM watsonx.ai</text>
  <text class="sub" x="663" y="434" text-anchor="middle">mistral-small-3-1-24b, per-task token budgets</text>

  <!-- Edges -->
  <path class="edge" d="M 138 217 L 178 217"/>
  <path class="edge" d="M 350 217 L 394 217"/>

  <!-- planner to SQL generator -->
  <path class="edge" d="M 538 205 C 562 205, 562 128, 584 128"/>
  <text class="edge-label" x="546" y="152" text-anchor="middle">data</text>

  <!-- planner to chat -->
  <path class="edge" d="M 538 232 C 562 232, 562 314, 584 314"/>
  <text class="edge-label" x="548" y="290" text-anchor="middle">chat</text>

  <!-- SQL generator to SQLite -->
  <path class="edge" d="M 738 128 L 788 128"/>

  <!-- model calls -->
  <path class="edge" d="M 468 260 C 468 380, 520 400, 560 405" stroke-dasharray="4 3"/>
  <path class="edge" d="M 663 164 C 700 200, 700 340, 690 388" stroke-dasharray="4 3"/>
  <path class="edge" d="M 663 344 L 663 388" stroke-dasharray="4 3"/>

  <!-- Notes -->
  <text class="note" x="20" y="40">Every model call is dispatched with asyncio.to_thread: the watsonx SDK is synchronous and would</text>
  <text class="note" x="20" y="56">otherwise block the event loop for the whole round trip.</text>
  <text class="note" x="792" y="196">The answer and the SQL that</text>
  <text class="note" x="792" y="211">produced it both go back to</text>
  <text class="note" x="792" y="226">the browser.</text>
  <text class="note" x="398" y="150">Off-topic: a fixed decline,</text>
  <text class="note" x="398" y="165">no second model call.</text>
</svg>
