# Evaluation cases for the Archer text-to-SQL pipeline.
#
# Every case states what the pipeline should do, not how. SQL is graded by
# executing both the expected and the generated query against the dataset and
# comparing result sets, so a query that reaches the right answer by different
# means is correct - which is the point. String comparison would fail perfectly
# good SQL and is not what anyone means by accuracy.
#
# Fields:
#   id            stable identifier, used in reports
#   question      the natural-language input
#   route         expected kind of answer: data | chat
#   expect_kind   overrides route where the answer should be a decline:
#                 data | chat | decline
#   category      grouping for the results table
#   expected_sql  reference query (data cases only)
#   ordered       true when row order is part of correctness (top-N questions)
#
# Conversation cases (planner):
#   history                   earlier exchanges, scripted: each a question plus
#                             either the sql that answered it (executed for real)
#                             or an answer. Scripted so a follow-up case tests
#                             the follow-up, not a re-run of the earlier answer.
#   interpreted_must_include  words the restated question must contain, so a
#                             wrong restatement is reported as the planner's fault
#   interpreted_none          true when the question must not be restated
#   answer_includes_any       for chat: the reply must contain one of these
#   holdout                   written once and run, never tuned against; reported
#                             separately as the honest measure of new behaviour
#
# Names used in questions come from the generated dataset, so they are
# reproducible: regenerating with the same seed keeps these cases valid.

# ---------------------------------------------------------------------------
# Aggregates
# ---------------------------------------------------------------------------

- id: total-revenue-2025
  question: What was the total revenue in 2025?
  route: data
  category: aggregate
  expected_sql: >
    SELECT SUM(revenue) FROM sales_data
    WHERE STRFTIME('%Y', document_date) = '2025'

- id: total-revenue-all-time
  question: What is the total revenue across the whole database?
  route: data
  category: aggregate
  expected_sql: SELECT SUM(revenue) FROM sales_data

- id: deal-count-2024
  question: How many deals were there in 2024?
  route: data
  category: aggregate
  expected_sql: >
    SELECT COUNT(DISTINCT document_number) FROM sales_data
    WHERE STRFTIME('%Y', document_date) = '2024'

- id: line-count-2024
  question: How many sales lines were there in 2024?
  route: data
  category: aggregate
  expected_sql: >
    SELECT COUNT(*) FROM sales_data
    WHERE STRFTIME('%Y', document_date) = '2024'

- id: software-revenue-total
  question: What is our total software revenue?
  route: data
  category: aggregate
  expected_sql: SELECT SUM(revenue) FROM sales_data WHERE item_group = 'IBM SOFT'

- id: hardware-revenue-2023
  question: What was the total hardware revenue in 2023?
  route: data
  category: aggregate
  expected_sql: >
    SELECT SUM(revenue) FROM sales_data
    WHERE item_group = 'IBM CCHW' AND STRFTIME('%Y', document_date) = '2023'

- id: services-revenue-total
  question: What is the total services revenue?
  route: data
  category: aggregate
  expected_sql: SELECT SUM(revenue) FROM sales_data WHERE item_group = 'IBM SERV'

- id: revenue-march-2025
  question: What was the total revenue in March 2025?
  route: data
  category: aggregate
  expected_sql: >
    SELECT SUM(revenue) FROM sales_data
    WHERE STRFTIME('%Y-%m', document_date) = '2025-03'

- id: credit-total
  question: What is the total value of all credits?
  route: data
  category: aggregate
  expected_sql: SELECT SUM(revenue) FROM sales_data WHERE document_type = 'Credit'

- id: distinct-customer-count
  question: How many different partners are there?
  route: data
  category: aggregate
  expected_sql: SELECT COUNT(DISTINCT customer_name) FROM sales_data

# ---------------------------------------------------------------------------
# Ranking
# ---------------------------------------------------------------------------

- id: top-5-customers
  question: Show me the top 5 customers by revenue
  route: data
  category: ranking
  ordered: true
  expected_sql: >
    SELECT customer_name, SUM(revenue) FROM sales_data
    GROUP BY customer_name ORDER BY SUM(revenue) DESC LIMIT 5

- id: top-3-end-users
  question: Which 3 end users have the highest revenue?
  route: data
  category: ranking
  ordered: true
  expected_sql: >
    SELECT end_user_company_name, SUM(revenue) FROM sales_data
    GROUP BY end_user_company_name ORDER BY SUM(revenue) DESC LIMIT 3

- id: top-10-products
  question: What are the top 10 products by revenue?
  route: data
  category: ranking
  ordered: true
  expected_sql: >
    SELECT item_description, SUM(revenue) FROM sales_data
    GROUP BY item_description ORDER BY SUM(revenue) DESC LIMIT 10

# The reference here returns the full deal lines, not just the document
# number. That is what the prompt instructs for "show me the biggest deal":
# a deal is a set of lines, and the user asked to see it. The first version of
# this case expected a bare document_number and failed the model for obeying
# its own documented behaviour - a reminder that a wrong reference query is
# worse than no eval at all, because it manufactures a bug report.
- id: biggest-deal-2025
  question: Show me the biggest deal of 2025
  route: data
  category: ranking
  ordered: true
  expected_sql: >
    SELECT customer_name, document_date, document_number, item_group,
    item_description, revenue, end_user_company_name, quantity
    FROM sales_data
    WHERE document_number IN (
      SELECT document_number FROM sales_data
      WHERE STRFTIME('%Y', document_date) = '2025'
      GROUP BY document_number ORDER BY SUM(revenue) DESC LIMIT 1)
    ORDER BY document_number, document_date DESC

# ---------------------------------------------------------------------------
# Filtering
# ---------------------------------------------------------------------------

- id: revenue-for-named-customer
  question: What was the total revenue for Galaxy Crest Global PLC?
  route: data
  category: filter
  expected_sql: >
    SELECT SUM(revenue) FROM sales_data
    WHERE LOWER(customer_name) LIKE LOWER('%Galaxy Crest Global%')

- id: deals-for-customer-in-year
  question: How many deals did Aurora Harbour Partners PLC do in 2024?
  route: data
  category: filter
  expected_sql: >
    SELECT COUNT(DISTINCT document_number) FROM sales_data
    WHERE LOWER(customer_name) LIKE LOWER('%Aurora Harbour Partners%')
    AND STRFTIME('%Y', document_date) = '2024'

- id: hardware-deals-for-customer
  question: How many hardware deals did Helix Bridge Holdings Ltd do?
  route: data
  category: filter
  expected_sql: >
    SELECT COUNT(DISTINCT document_number) FROM sales_data
    WHERE item_group = 'IBM CCHW'
    AND LOWER(customer_name) LIKE LOWER('%Helix Bridge Holdings%')

- id: revenue-between-dates
  question: What was the total revenue between 1 January 2022 and 31 March 2022?
  route: data
  category: filter
  expected_sql: >
    SELECT SUM(revenue) FROM sales_data
    WHERE document_date >= '2022-01-01' AND document_date <= '2022-03-31'

- id: multi-year-deals
  question: How many deals are flagged as multi-year deals?
  route: data
  category: filter
  expected_sql: >
    SELECT COUNT(DISTINCT document_number) FROM sales_data
    WHERE multi_year_deal_flag_so = 'Yes'

- id: revenue-by-item-group
  question: Show total revenue broken down by item group
  route: data
  category: filter
  expected_sql: >
    SELECT item_group, SUM(revenue) FROM sales_data GROUP BY item_group

# Regression: braces in a question used to make the prompt renderer fail, so
# this returned the generic "trouble running that query" message instead.
- id: braces-in-question
  question: What was the total revenue in 2024 {all item groups}?
  route: data
  category: filter
  expected_sql: >
    SELECT SUM(revenue) FROM sales_data
    WHERE STRFTIME('%Y', document_date) = '2024'

# ---------------------------------------------------------------------------
# Existence checks
#
# This category exists because it was a known failure mode: the model used to
# answer "does X exist" with a COUNT, which cannot distinguish "no match" from
# "the query was wrong". The prompt was changed to return matching names.
# ---------------------------------------------------------------------------

- id: existence-partner-present
  question: Is there a partner called Galaxy?
  route: data
  category: existence
  expected_sql: >
    SELECT DISTINCT customer_name FROM sales_data
    WHERE LOWER(customer_name) LIKE LOWER('%galaxy%') LIMIT 100

- id: existence-partner-absent
  question: Is there a partner called Teapots?
  route: data
  category: existence
  expected_sql: >
    SELECT DISTINCT customer_name FROM sales_data
    WHERE LOWER(customer_name) LIKE LOWER('%teapots%') LIMIT 100

- id: existence-end-user
  question: Do we have any end users with Helix in the name?
  route: data
  category: existence
  expected_sql: >
    SELECT DISTINCT end_user_company_name FROM sales_data
    WHERE LOWER(end_user_company_name) LIKE LOWER('%helix%') LIMIT 100

- id: existence-partner-substring
  question: Can you find partners with global in the name?
  route: data
  category: existence
  expected_sql: >
    SELECT DISTINCT customer_name FROM sales_data
    WHERE LOWER(customer_name) LIKE LOWER('%global%') LIMIT 100

- id: existence-product
  question: Do we sell anything called Maximo?
  route: data
  category: existence
  expected_sql: >
    SELECT DISTINCT item_description FROM sales_data
    WHERE LOWER(item_description) LIKE LOWER('%maximo%') LIMIT 100

# ---------------------------------------------------------------------------
# Listing
# ---------------------------------------------------------------------------

- id: distinct-partners-in-month
  question: Show me all unique partners who did deals in March 2025
  route: data
  category: listing
  expected_sql: >
    SELECT DISTINCT customer_name FROM sales_data
    WHERE STRFTIME('%Y-%m', document_date) = '2025-03'
    ORDER BY customer_name LIMIT 100

- id: distinct-item-groups
  question: What item groups are in the database?
  route: data
  category: listing
  expected_sql: SELECT DISTINCT item_group FROM sales_data

- id: distinct-vendors
  question: List the distinct vendor names
  route: data
  category: listing
  expected_sql: SELECT DISTINCT vendor_name FROM sales_data

# ---------------------------------------------------------------------------
# Conversational routing
#
# These have no SQL. They test that the planner keeps them away from the
# database, which is where the pipeline is most likely to waste a call or
# produce nonsense, and that off-topic requests are declined rather than
# answered.
# ---------------------------------------------------------------------------

- id: chat-greeting
  question: Hello!
  route: chat
  category: conversation

- id: chat-capability
  question: Who are you and what can you do?
  route: chat
  category: conversation

- id: chat-off-topic-creative
  question: Write me a poem about the sea
  route: chat
  expect_kind: decline
  category: decline

- id: chat-off-topic-knowledge
  question: What is the capital of Australia?
  route: chat
  expect_kind: decline
  category: decline

- id: chat-thanks
  question: Thanks, that is really helpful
  route: chat
  category: conversation

# ---------------------------------------------------------------------------
# Deal values (SQL prompt v4, rule 4b)
#
# A deal's value is the total of its lines. The first of these failed when
# the chat API was introduced: the model averaged line revenue within each
# deal. Rule 4b was written for it.
# ---------------------------------------------------------------------------

- id: average-deal-value-2025
  question: What was the average deal value in 2025?
  route: data
  category: aggregate
  expected_sql: >
    WITH deals AS (
      SELECT document_number, SUM(revenue) AS deal_value FROM sales_data
      WHERE STRFTIME('%Y', document_date) = '2025'
      GROUP BY document_number
    )
    SELECT AVG(deal_value) FROM deals

- id: largest-deal-value-for-partner
  question: What was the largest single deal value for Quantum Acorn Partners Ltd?
  route: data
  category: aggregate
  expected_sql: >
    SELECT MAX(deal_value) FROM (
      SELECT SUM(revenue) AS deal_value FROM sales_data
      WHERE customer_name = 'Quantum Acorn Partners Ltd'
      GROUP BY document_number
    )

# ---------------------------------------------------------------------------
# Follow-ups
#
# Each has a scripted earlier exchange. The follow-up only makes sense with
# it, so these measure whether the planner restates the question correctly
# (interpreted_must_include) and whether the restated question is answered
# correctly (expected_sql). Names and questions differ from the planner
# prompt's own examples.
# ---------------------------------------------------------------------------

- id: followup-ordinal-deal-count
  history:
    - question: Show me the top 5 customers by revenue
      sql: >
        SELECT customer_name, SUM(revenue) FROM sales_data
        GROUP BY customer_name ORDER BY SUM(revenue) DESC LIMIT 5
  question: How many deals did the third one do?
  route: data
  category: followup
  interpreted_must_include: [Helix Bridge Holdings Ltd]
  expected_sql: >
    SELECT COUNT(DISTINCT document_number) FROM sales_data
    WHERE customer_name = 'Helix Bridge Holdings Ltd'

- id: followup-refine-year
  history:
    - question: What was the total hardware revenue in 2023?
      sql: >
        SELECT SUM(revenue) FROM sales_data
        WHERE item_group = 'IBM CCHW' AND STRFTIME('%Y', document_date) = '2023'
  question: And in 2022?
  route: data
  category: followup
  interpreted_must_include: [hardware, "2022"]
  expected_sql: >
    SELECT SUM(revenue) FROM sales_data
    WHERE item_group = 'IBM CCHW' AND STRFTIME('%Y', document_date) = '2022'

- id: followup-refine-item-group
  history:
    - question: What is the total services revenue?
      sql: SELECT SUM(revenue) FROM sales_data WHERE item_group = 'IBM SERV'
  question: What about software?
  route: data
  category: followup
  interpreted_must_include: [software]
  expected_sql: SELECT SUM(revenue) FROM sales_data WHERE item_group = 'IBM SOFT'

- id: followup-pronoun-deal-count
  history:
    - question: What was the total revenue for Galaxy Crest Global PLC?
      sql: >
        SELECT SUM(revenue) FROM sales_data
        WHERE LOWER(customer_name) LIKE LOWER('%galaxy crest global plc%')
  question: How many deals did they do in 2024?
  route: data
  category: followup
  interpreted_must_include: [Galaxy Crest Global PLC, "2024"]
  expected_sql: >
    SELECT COUNT(DISTINCT document_number) FROM sales_data
    WHERE customer_name = 'Galaxy Crest Global PLC'
      AND STRFTIME('%Y', document_date) = '2024'

- id: followup-end-user-ordinal
  history:
    - question: Which 3 end users have the highest revenue?
      sql: >
        SELECT end_user_company_name, SUM(revenue) FROM sales_data
        GROUP BY end_user_company_name ORDER BY SUM(revenue) DESC LIMIT 3
  question: How much revenue did the second one bring in during 2025?
  route: data
  category: followup
  interpreted_must_include: [end user, Orbit Vertex Data PLC]
  expected_sql: >
    SELECT SUM(revenue) FROM sales_data
    WHERE end_user_company_name = 'Orbit Vertex Data PLC'
      AND STRFTIME('%Y', document_date) = '2025'

- id: followup-unrelated-question-is-left-alone
  history:
    - question: Show me the top 5 customers by revenue
      sql: >
        SELECT customer_name, SUM(revenue) FROM sales_data
        GROUP BY customer_name ORDER BY SUM(revenue) DESC LIMIT 5
  question: What was the total revenue in 2025?
  route: data
  category: followup
  interpreted_none: true
  expected_sql: >
    SELECT SUM(revenue) FROM sales_data
    WHERE STRFTIME('%Y', document_date) = '2025'

# ---------------------------------------------------------------------------
# Data-related chat: explained, not refused
# ---------------------------------------------------------------------------

- id: chat-explain-sql
  history:
    - question: Show me the top 5 customers by revenue
      sql: >
        SELECT customer_name, SUM(revenue) FROM sales_data
        GROUP BY customer_name ORDER BY SUM(revenue) DESC LIMIT 5
  question: Can you explain that query?
  route: chat
  category: chat
  answer_includes_any: [group, sum, total]

- id: chat-item-group-term
  question: What does IBM CCHW mean?
  route: chat
  category: chat
  answer_includes_any: [hardware]

- id: chat-credit-term
  question: What is a credit in this data?
  route: chat
  category: chat
  answer_includes_any: [refund, negative, revers]

- id: chat-column-meaning
  question: What does the multi_year_deal_flag_so column mean?
  route: chat
  category: chat
  answer_includes_any: [year]

# ---------------------------------------------------------------------------
# Off-topic: declined with the fixed message
# ---------------------------------------------------------------------------

- id: decline-coding-help
  question: Can you help me write a Python script to sort a list?
  route: chat
  expect_kind: decline
  category: decline

- id: decline-weather
  question: What's the weather like in London today?
  route: chat
  expect_kind: decline
  category: decline

# ---------------------------------------------------------------------------
# Multi-part messages
#
# One message, several questions. Graded part by part: the right number of
# parts, each of the right kind, each answered correctly.
# ---------------------------------------------------------------------------

- id: multipart-data-and-chat
  question: What was the total revenue in 2023, and what does IBM SOFT mean?
  route: data
  expect_kind: mixed
  category: multipart
  parts:
    - kind: data
      expected_sql: >
        SELECT SUM(revenue) FROM sales_data
        WHERE STRFTIME('%Y', document_date) = '2023'
    - kind: chat
      answer_includes_any: [software]

- id: multipart-two-years
  question: How many deals were there in 2022, and how many in 2023?
  route: data
  category: multipart
  parts:
    - kind: data
      expected_sql: >
        SELECT COUNT(DISTINCT document_number) FROM sales_data
        WHERE STRFTIME('%Y', document_date) = '2022'
    - kind: data
      expected_sql: >
        SELECT COUNT(DISTINCT document_number) FROM sales_data
        WHERE STRFTIME('%Y', document_date) = '2023'

# ---------------------------------------------------------------------------
# Clarifying questions
#
# Asked only when a message cannot be answered without guessing. Every other
# case in this file doubles as a must-not-clarify case: a clear question met
# with a question fails.
# ---------------------------------------------------------------------------

- id: clarify-no-earlier-list
  question: How many deals did the third one do?
  route: chat
  expect_kind: clarify
  category: clarify

- id: clarify-no-subject
  question: How did they do last year?
  route: chat
  expect_kind: clarify
  category: clarify

# ---------------------------------------------------------------------------
# Hold-out
#
# Written once and run; never tuned against. If a prompt change is made to
# fix one of these, it stops being a hold-out case and moves to its category.
# ---------------------------------------------------------------------------

- id: holdout-followup-product-ordinal
  holdout: true
  history:
    - question: What are the top 3 products by revenue?
      sql: >
        SELECT item_description, SUM(revenue) FROM sales_data
        GROUP BY item_description ORDER BY SUM(revenue) DESC LIMIT 3
  question: how many units of the first one did we sell?
  route: data
  category: holdout
  interpreted_must_include: [IBM Lab Services Implementation Professional Services Day Rate]
  expected_sql: >
    SELECT SUM(quantity) FROM sales_data
    WHERE item_description = 'IBM Lab Services Implementation Professional Services Day Rate'

- id: holdout-followup-same-for-another-year
  holdout: true
  history:
    - question: How many deals did Aurora Harbour Partners PLC do in 2024?
      sql: >
        SELECT COUNT(DISTINCT document_number) FROM sales_data
        WHERE customer_name = 'Aurora Harbour Partners PLC'
          AND STRFTIME('%Y', document_date) = '2024'
  question: same question for 2023 please
  route: data
  category: holdout
  interpreted_must_include: [Aurora Harbour Partners PLC, "2023"]
  expected_sql: >
    SELECT COUNT(DISTINCT document_number) FROM sales_data
    WHERE customer_name = 'Aurora Harbour Partners PLC'
      AND STRFTIME('%Y', document_date) = '2023'

- id: holdout-chat-explain-scalar
  holdout: true
  history:
    - question: What is the total value of all credits?
      sql: SELECT SUM(revenue) FROM sales_data WHERE document_type = 'Credit'
  question: why is that number negative?
  route: chat
  category: holdout
  answer_includes_any: [credit, refund, revers]

- id: holdout-chat-capability-followups
  holdout: true
  question: Can I ask follow-up questions about an answer?
  route: chat
  category: holdout

- id: holdout-decline-recipe
  holdout: true
  question: Give me a recipe for banana bread
  route: chat
  expect_kind: decline
  category: holdout

# Was a hold-out until SQL prompt v4: rule 4b first made the model measure
# "most licences" by revenue, and its wording was narrowed in response. A
# prompt change made because of a hold-out case ends its hold-out status.
- id: end-user-most-licences
  question: Which end user bought the most IBM Maximo licences?
  route: data
  category: ranking
  expected_sql: >
    SELECT end_user_company_name, SUM(quantity) FROM sales_data
    WHERE LOWER(item_description) LIKE '%maximo%'
    GROUP BY end_user_company_name ORDER BY SUM(quantity) DESC LIMIT 1

# Written to replace the case above, before any run against it.
- id: holdout-partner-most-credits
  holdout: true
  question: Which partner had the most credit notes in 2023?
  route: data
  category: holdout
  expected_sql: >
    SELECT customer_name, COUNT(DISTINCT document_number) FROM sales_data
    WHERE document_type = 'Credit' AND STRFTIME('%Y', document_date) = '2023'
    GROUP BY customer_name ORDER BY COUNT(DISTINCT document_number) DESC LIMIT 1

# Multi-part and clarify hold-outs, written before any run against them.
- id: holdout-multipart-ranking-and-existence
  holdout: true
  question: Which item group had the most revenue in 2024, and is there a partner called Falcon?
  route: data
  category: holdout
  parts:
    - kind: data
      expected_sql: >
        SELECT item_group, SUM(revenue) FROM sales_data
        WHERE STRFTIME('%Y', document_date) = '2024'
        GROUP BY item_group ORDER BY SUM(revenue) DESC LIMIT 1
    - kind: data
      expected_sql: >
        SELECT DISTINCT customer_name FROM sales_data
        WHERE LOWER(customer_name) LIKE '%falcon%'

- id: holdout-clarify-compare
  holdout: true
  question: Compare that with the year before
  route: chat
  expect_kind: clarify
  category: holdout

