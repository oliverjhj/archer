# .github/dependabot.yml
# Archer - Automated dependency update configuration.
#
# Monitors:
#   - Python pip dependencies in backend/requirements.txt
#   - GitHub Actions workflow dependencies
#   - Docker base image in backend/Dockerfile
#
# Cadence: weekly, Monday morning, to minimise PR noise.

version: 2

updates:
  # Python pip dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # Docker base image dependencies
  #
  # Both base images are pinned deliberately and are not Dependabot's to move:
  #
  #   python  the runtime version is a compatibility decision, taken when the
  #           test suite has been run against it
  #   node    the frontend build stage is on 20 LTS to match the CI job, so
  #           that CI and the image agree on the version that actually
  #           produces the artefact. Dependabot offered 26-slim within minutes
  #           of this repository existing, which would have quietly broken
  #           that agreement.
  #
  # Patch updates still come through, which is where the security fixes are.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    commit-message:
      prefix: "chore(deps)"
