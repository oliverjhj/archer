# CI workflow for Archer
# Phase 2A - lightweight quality checks with no runtime dependencies.
# Phase 2B - Docker build validation (image build only, no container run, no secrets).
# Runs on every push to main and on every pull request.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  compile-and-validate:
    name: Compile and validate
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository at the current commit.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Step 2: Install the exact Python version required by the project.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Step 3: Install backend runtime dependencies.
      # Required so that the application source files are present and
      # consistent with their declared dependency versions.
      # Note: py_compile does not resolve imports - this step is for
      # environment consistency, not import resolution.
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # Step 4: Install PyYAML for YAML validation (step 7).
      # Installed explicitly to avoid relying on transitive dependency
      # availability, which may change as the dependency tree evolves.
      - name: Install PyYAML
        run: python -m pip install PyYAML

      # Step 5: Check Python syntax using py_compile.
      # Uses the stdlib py_compile module to verify every .py file under
      # backend/ compiles without syntax errors.
      # py_compile parses source files to bytecode only - it does NOT
      # execute any module-level code, import the application, or start
      # the FastAPI server.
      - name: Check Python syntax (py_compile)
        run: |
          python - <<'EOF'
          import py_compile
          import sys
          from pathlib import Path

          errors = []
          files = sorted(Path("backend").rglob("*.py"))

          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except py_compile.PyCompileError as exc:
                  errors.append(str(exc))

          if errors:
              print("Syntax errors found:\n")
              for err in errors:
                  print(f"  {err}")
              sys.exit(1)

          print(f"All {len(files)} file(s) compiled successfully.")
          EOF

      # Step 6: Validate backend/pyproject.toml.
      # Uses the stdlib tomllib module (Python 3.11+) to confirm the file
      # is well-formed TOML. No third-party tool required.
      - name: Validate pyproject.toml
        run: |
          python - <<'EOF'
          import tomllib
          import sys

          path = "backend/pyproject.toml"
          try:
              with open(path, "rb") as fh:
                  tomllib.load(fh)
              print(f"{path} is valid TOML.")
          except tomllib.TOMLDecodeError as exc:
              print(f"Invalid TOML in {path}: {exc}")
              sys.exit(1)
          EOF

      # Step 7: Validate YAML configuration files.
      # Uses PyYAML (installed explicitly in step 4) to confirm that
      # .pre-commit-config.yaml and workflow YAML files are well-formed.
      - name: Validate YAML config files
        run: |
          python - <<'EOF'
          import yaml
          import sys

          files = [
              ".pre-commit-config.yaml",
              ".github/workflows/ci.yml",
              ".github/workflows/deploy-code-engine.yml",
              ".github/dependabot.yml",
          ]
          errors = []

          for path in files:
              try:
                  with open(path) as fh:
                      yaml.safe_load(fh)
                  print(f"{path} is valid YAML.")
              except yaml.YAMLError as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              for err in errors:
                  print(f"Invalid YAML - {err}")
              sys.exit(1)
          EOF

  # Phase 3A: unit tests only.
  # No .env, no sales.db, no IBM Cloud, no COS, no watsonx required.
  # Cloud/LLM env vars are intentionally absent; conftest.py provides safe stubs
  # for JWT_SECRET_KEY, CSRF_SECRET_KEY, and WEBHOOK_SECRET only.
  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository at the current commit.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Step 2: Install the exact Python version required by the project.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Step 3: Install backend runtime dependencies.
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # Step 4: Install test extras via editable install from repo root.
      # The editable install ensures archer.* imports resolve without any
      # PYTHONPATH manipulation.
      - name: Install test extras
        run: pip install -e "backend[test]"

      # Step 5: Run unit tests.
      # Only the "unit" marker is collected; no secrets or external services
      # are required.
      - name: Run unit tests
        run: pytest backend/tests/unit -m unit -v --tb=short

  # Frontend type checking and production build.
  #
  # This gate did not exist while the frontend was a scaffold, which is why a
  # dependency bump that would have broken the build could pass CI green. Now
  # that FastAPI serves the built bundle, a frontend that fails to compile is
  # a broken deployment, not a broken side project.
  frontend:
    name: Frontend (typecheck and build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Node 20 LTS, matching the Dockerfile build stage. Local development
      # runs a newer Node; CI and the image agree on the version that actually
      # produces the artefact.
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci rather than npm install: it installs exactly the lockfile and
      # fails if the lockfile and package.json disagree, which is the point of
      # running this in CI at all.
      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npm run typecheck
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository at the current commit.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Step 2: Build the Docker image from the repo root build context.
      # Validates that all COPY paths resolve, RUN steps succeed, and the
      # image layers build cleanly.
      # Does NOT run the container.
      # Does NOT require .env, sales.db, IBM Cloud, COS, watsonx, or any secrets.
      - name: Build Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t archer-backend:ci-test \
            .
